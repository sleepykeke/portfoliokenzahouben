<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title data-i18n="contact.title">Contact</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/contact.css">
</head>


<body class="contact-body" data-page="contact">


    <!-- ==================================================
         HAMBURGER MENU
    ================================================== -->

    <div class="hamburger-menu">

        <button
            class="hamburger-button"
            aria-label="Menu openen"
            type="button"
            data-i18n="common.menuOpen"
            data-i18n-attr="aria-label"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>


        <nav class="menu-overlay">

            <img
                src="./images/noise_background.png"
                class="menu-backgroundnoise"
                alt=""
            >


            <button
                class="menu-close"
                aria-label="Menu sluiten"
                type="button"
                data-i18n="common.menuClose"
                data-i18n-attr="aria-label"
            >
                ×
            </button>


            <div class="menu-content">

                <h6>
                    <a
                        href="index.html"
                        data-i18n="common.home"
                    ></a>
                </h6>

                <h6>
                    <a
                        href="about.html"
                        data-i18n="common.about"
                    ></a>
                </h6>

                <h6>
                    <a
                        href="projects.html"
                        data-i18n="common.projects"
                    ></a>
                </h6>

                <h6>
                    <a
                        href="contact.html"
                        data-i18n="common.contact"
                    ></a>
                </h6>


                <div class="menu-languages">

                    <h3>

                        <a
                            href="#"
                            data-lang="nl"
                            data-i18n="common.nl"
                        ></a>

                        <span>|</span>

                        <a
                            href="#"
                            data-lang="fr"
                            data-i18n="common.fr"
                        ></a>

                        <span>|</span>

                        <a
                            href="#"
                            data-lang="en"
                            data-i18n="common.eng"
                        ></a>

                    </h3>

                </div>

            </div>

        </nav>

    </div>



    <!-- ==================================================
         CONTACT
    ================================================== -->

    <main class="contact-wrapper">

        <section class="contact-section">


            <!-- ==================================================
                 TITEL
            ================================================== -->

            <h2 data-i18n="contact.title">
                Contacteer mij
            </h2>


            <!-- ==================================================
                 ONDERTITEL
            ================================================== -->

            <h4>

                <span data-i18n="contact.subtitle1">
                    Heb je vragen of een opmerking?
                </span>

                <br>

                <span data-i18n="contact.subtitle2">
                    Laat het me weten!
                </span>

            </h4>



            <!-- ==================================================
                 FORMULIER
            ================================================== -->

            <form
                class="contact-form"
                action="https://formspree.io/f/mrpgqlwo"
                method="POST"
            >


                <!-- ==================================================
                     VOORNAAM + NAAM
                ================================================== -->

                <div class="contact-form-row">

                    <input
                        type="text"
                        name="voornaam"
                        placeholder="Voornaam"
                        data-i18n="common.firstName"
                        data-i18n-attr="placeholder"
                        autocomplete="given-name"
                        required
                    >


                    <input
                        type="text"
                        name="naam"
                        placeholder="Naam"
                        data-i18n="common.lastName"
                        data-i18n-attr="placeholder"
                        autocomplete="family-name"
                        required
                    >

                </div>



                <!-- ==================================================
                     E-MAIL
                ================================================== -->

                <input
                    type="email"
                    name="email"
                    class="contact-input-full"
                    placeholder="E-mailadres"
                    data-i18n="common.email"
                    data-i18n-attr="placeholder"
                    autocomplete="email"
                    required
                >



                <!-- ==================================================
                     BOODSCHAP
                ================================================== -->

                <textarea
                    name="boodschap"
                    class="contact-message"
                    placeholder="Boodschap"
                    data-i18n="common.message"
                    data-i18n-attr="placeholder"
                    required
                ></textarea>



                <!-- ==================================================
                     VERZENDEN
                ================================================== -->

                <button
                    type="submit"
                    class="contact-submit"
                    data-i18n="common.send"
                >
                    Verzenden
                </button>

            </form>

        </section>



        <!-- ==================================================
             FOOTER
        ================================================== -->

        <footer class="footer">

            <div class="footer-content">

                <nav class="footer-nav">

                    <a
                        href="index.html"
                        data-i18n="common.home"
                    ></a>

                    <a
                        href="about.html"
                        data-i18n="common.about"
                    ></a>

                    <a
                        href="projects.html"
                        data-i18n="common.projects"
                    ></a>

                    <a
                        href="contact.html"
                        data-i18n="common.contact"
                    ></a>

                </nav>


                <div class="footer-languages">

                    <a
                        href="#"
                        data-lang="nl"
                        data-i18n="common.nl"
                    ></a>

                    <span>|</span>

                    <a
                        href="#"
                        data-lang="fr"
                        data-i18n="common.fr"
                    ></a>

                    <span>|</span>

                    <a
                        href="#"
                        data-lang="en"
                        data-i18n="common.eng"
                    ></a>

                </div>


                <div class="footer-socials">

                    <a
                        href="https://www.linkedin.com/in/kenza-houben-a3b9473aa/"
                        class="footer-social"
                        aria-label="LinkedIn"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        <img
                            src="./images/linkedin.svg"
                            alt=""
                        >
                    </a>


                    <a
                        href="https://www.artstation.com/kenzahouben"
                        class="footer-social"
                        aria-label="ArtStation"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        <img
                            src="./images/artstation.svg"
                            alt=""
                        >
                    </a>

                </div>

            </div>


            <div class="footer-bottom">

                <p data-i18n="common.copyright">
                    © 2026 Kenza. Alle rechten voorbehouden
                </p>

            </div>

        </footer>

    </main>



    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->

    <script src="js/hamburger-menu.js"></script>
    <script src="js/language.js"></script>

</body>

</html>
