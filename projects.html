<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Projecten</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/projects.css">
</head>


<body class="projects-body" data-page="projectsPage">


    <!-- ==================================================
         HAMBURGER MENU
    ================================================== -->

    <div class="hamburger-menu">

        <button
            class="hamburger-button"
            aria-label="Menu openen"
            type="button"
            data-i18n="common.menuOpen"
            data-i18n-attr="aria-label"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>


        <nav class="menu-overlay">

            <img
                src="./images/noise_background.png"
                class="menu-backgroundnoise"
                alt=""
            >


            <button
                class="menu-close"
                aria-label="Menu sluiten"
                type="button"
                data-i18n="common.menuClose"
                data-i18n-attr="aria-label"
            >
                ×
            </button>


            <div class="menu-content">

                <h6>
                    <a
                        href="index.html"
                        data-i18n="common.home"
                    ></a>
                </h6>

                <h6>
                    <a
                        href="about.html"
                        data-i18n="common.about"
                    ></a>
                </h6>

                <h6>
                    <a
                        href="projects.html"
                        data-i18n="common.projects"
                    ></a>
                </h6>

                <h6>
                    <a
                        href="contact.html"
                        data-i18n="common.contact"
                    ></a>
                </h6>


                <div class="menu-languages">

                    <h3>

                        <a
                            href="#"
                            data-lang="nl"
                            data-i18n="common.nl"
                        ></a>

                        <span>|</span>

                        <a
                            href="#"
                            data-lang="fr"
                            data-i18n="common.fr"
                        ></a>

                        <span>|</span>

                        <a
                            href="#"
                            data-lang="en"
                            data-i18n="common.eng"
                        ></a>

                    </h3>

                </div>

            </div>

        </nav>

    </div>



    <!-- ==================================================
         PROJECTEN
    ================================================== -->

    <main class="projects-wrapper">

        <section class="projects-section">


            <!-- ==================================================
                 NOISE ACHTERGROND
            ================================================== -->

            <img
                src="./images/noise_background.png"
                class="projects-background"
                alt=""
            >


            <div class="projects-content">


                <!-- ==================================================
                     TITEL
                ================================================== -->

                <h2 data-i18n="projectsPage.title">
                    Mijn projecten
                </h2>



                <!-- ==================================================
                     FILTERS
                ================================================== -->

                <div class="projects-filters">

                    <button
                        class="project-filter active"
                        data-filter="all"
                        type="button"
                        data-i18n="projectsPage.all"
                    >
                        Alles
                    </button>


                    <button
                        class="project-filter"
                        data-filter="uiux"
                        type="button"
                        data-i18n="projectsPage.uiux"
                    >
                        UI/UX Design
                    </button>


                    <button
                        class="project-filter"
                        data-filter="3d"
                        type="button"
                        data-i18n="projectsPage.animation"
                    >
                        3D &amp; Animatie
                    </button>

                </div>



                <!-- ==================================================
                     PROJECTEN
                ================================================== -->

                <div
                    class="projects-grid"
                    id="projects-grid"
                ></div>

            </div>

        </section>



        <!-- ==================================================
             FOOTER
        ================================================== -->

        <footer class="footer">

            <div class="footer-content">

                <nav class="footer-nav">

                    <a
                        href="index.html"
                        data-i18n="common.home"
                    ></a>

                    <a
                        href="about.html"
                        data-i18n="common.about"
                    ></a>

                    <a
                        href="projects.html"
                        data-i18n="common.projects"
                    ></a>

                    <a
                        href="contact.html"
                        data-i18n="common.contact"
                    ></a>

                </nav>


                <div class="footer-languages">

                    <a
                        href="#"
                        data-lang="nl"
                        data-i18n="common.nl"
                    ></a>

                    <span>|</span>

                    <a
                        href="#"
                        data-lang="fr"
                        data-i18n="common.fr"
                    ></a>

                    <span>|</span>

                    <a
                        href="#"
                        data-lang="en"
                        data-i18n="common.eng"
                    ></a>

                </div>


                <div class="footer-socials">

                    <a
                        href="https://www.linkedin.com/in/kenza-houben-a3b9473aa/"
                        class="footer-social"
                        aria-label="LinkedIn"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        <img
                            src="./images/linkedin.svg"
                            alt=""
                        >
                    </a>


                    <a
                        href="https://www.artstation.com/kenzahouben"
                        class="footer-social"
                        aria-label="ArtStation"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        <img
                            src="./images/artstation.svg"
                            alt=""
                        >
                    </a>

                </div>

            </div>


            <div class="footer-bottom">

                <p data-i18n="common.copyright">
                    © 2026 Kenza. Alle rechten voorbehouden
                </p>

            </div>

        </footer>

    </main>



    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->

    <script src="js/hamburger-menu.js"></script>
    <script src="js/projects.js"></script>
    <script src="js/language.js"></script>

</body>

</html>
